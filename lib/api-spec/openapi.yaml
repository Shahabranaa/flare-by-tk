openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Flare by TK Restaurant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: categories
    description: Menu categories
  - name: menu-items
    description: Menu items
  - name: deals
    description: Deals and promotions
  - name: orders
    description: Customer orders
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Categories ──────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all menu categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a menu category (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          description: Unauthorized

  /categories/{id}:
    get:
      operationId: getCategory
      tags: [categories]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Not found
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ── Menu Items ───────────────────────────────────────────────
  /menu-items:
    get:
      operationId: listMenuItems
      tags: [menu-items]
      summary: List all menu items, optionally filtered by category
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
        - name: available
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      operationId: createMenuItem
      tags: [menu-items]
      summary: Create a menu item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "401":
          description: Unauthorized

  /menu-items/{id}:
    get:
      operationId: getMenuItem
      tags: [menu-items]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Menu item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "404":
          description: Not found
    patch:
      operationId: updateMenuItem
      tags: [menu-items]
      summary: Update a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteMenuItem
      tags: [menu-items]
      summary: Delete a menu item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ── Deals ─────────────────────────────────────────────────────
  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List all deals (active ones for customers)
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deal"
    post:
      operationId: createDeal
      tags: [deals]
      summary: Create a deal (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "401":
          description: Unauthorized

  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          description: Not found
    patch:
      operationId: updateDeal
      tags: [deals]
      summary: Update a deal (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteDeal
      tags: [deals]
      summary: Delete a deal (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ── Orders ────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin only)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [new, preparing, ready, completed, cancelled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order (guest — no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed — response includes trackingToken for unauthenticated tracking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validation error

  /orders/track/{token}:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Track an order by UUID token (public — no auth, no PII in response)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public order status (PII stripped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrder"
        "404":
          description: Not found

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get full order by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ── Admin Dashboard ───────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Categories ─────────────────────────────────────────
    Category:
      type: object
      required: [id, name, slug, sortOrder, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        sortOrder:
          type: integer
        isActive:
          type: boolean
        itemCount:
          type: integer
        createdAt:
          type: string

    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        description:
          type: string
        imageUrl:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean

    # ── Menu Items ─────────────────────────────────────────
    MenuItem:
      type: object
      required: [id, name, slug, categoryId, price, isAvailable, isFeatured, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        price:
          type: number
        originalPrice:
          type: ["number", "null"]
        imageUrl:
          type: ["string", "null"]
        isAvailable:
          type: boolean
        isFeatured:
          type: boolean
        calories:
          type: ["integer", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string

    MenuItemInput:
      type: object
      required: [name, slug, categoryId, price]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: integer
        price:
          type: number
        originalPrice:
          type: number
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        isFeatured:
          type: boolean
        calories:
          type: integer
        tags:
          type: array
          items:
            type: string

    MenuItemUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
        description:
          type: string
        categoryId:
          type: integer
        price:
          type: number
        originalPrice:
          type: number
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        isFeatured:
          type: boolean
        calories:
          type: integer
        tags:
          type: array
          items:
            type: string

    # ── Deals ──────────────────────────────────────────────
    Deal:
      type: object
      required: [id, title, slug, discountType, isActive, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        discountType:
          type: string
          enum: [percentage, fixed, combo]
        discountValue:
          type: ["number", "null"]
        originalPrice:
          type: ["number", "null"]
        dealPrice:
          type: ["number", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string

    DealInput:
      type: object
      required: [title, slug, discountType]
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed, combo]
        discountValue:
          type: number
        originalPrice:
          type: number
        dealPrice:
          type: number
        isActive:
          type: boolean
        sortOrder:
          type: integer

    DealUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        slug:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        discountType:
          type: string
          enum: [percentage, fixed, combo]
        discountValue:
          type: number
        originalPrice:
          type: number
        dealPrice:
          type: number
        isActive:
          type: boolean
        sortOrder:
          type: integer

    # ── Orders ─────────────────────────────────────────────
    OrderItem:
      type: object
      required: [menuItemId, name, price, quantity]
      properties:
        menuItemId:
          type: integer
        name:
          type: string
        price:
          type: number
        quantity:
          type: integer

    Order:
      type: object
      required: [id, trackingToken, customerName, customerPhone, orderType, status, totalAmount, items, createdAt]
      properties:
        id:
          type: integer
        trackingToken:
          type: string
        customerName:
          type: string
        customerPhone:
          type: string
        customerAddress:
          type: ["string", "null"]
        orderType:
          type: string
          enum: [delivery, pickup]
        status:
          type: string
          enum: [new, preparing, ready, completed, cancelled]
        totalAmount:
          type: number
        specialInstructions:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string

    PublicOrder:
      type: object
      description: PII-stripped order view for unauthenticated tracking
      required: [id, trackingToken, orderType, status, totalAmount, items, createdAt]
      properties:
        id:
          type: integer
        trackingToken:
          type: string
        orderType:
          type: string
          enum: [delivery, pickup]
        status:
          type: string
          enum: [new, preparing, ready, completed, cancelled]
        totalAmount:
          type: number
        specialInstructions:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string

    OrderInput:
      type: object
      required: [customerName, customerPhone, orderType, items]
      properties:
        customerName:
          type: string
          minLength: 1
        customerPhone:
          type: string
          minLength: 1
        customerAddress:
          type: string
        orderType:
          type: string
          enum: [delivery, pickup]
        specialInstructions:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"

    OrderItemInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
          minimum: 1

    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [new, preparing, ready, completed, cancelled]

    # ── Dashboard ──────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalOrders, todayOrders, totalRevenue, todayRevenue, ordersByStatus, recentOrders]
      properties:
        totalOrders:
          type: integer
        todayOrders:
          type: integer
        totalRevenue:
          type: number
        todayRevenue:
          type: number
        ordersByStatus:
          type: object
          properties:
            new:
              type: integer
            preparing:
              type: integer
            ready:
              type: integer
            completed:
              type: integer
            cancelled:
              type: integer
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
